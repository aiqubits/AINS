name: ains-ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 依赖漏洞不随 push 更新：每周一 03:00 UTC 定期扫描 Cargo.lock
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========================================
  # Backend - Server CI
  # ========================================
  server:
    # 定时触发（schedule）只跑 security-audit：重 job 验证的是代码质量，
    # 代码未变时全量重跑是纯浪费（含 Postgres 复制集群 setup）。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      # Primary PostgreSQL (configured for streaming replication in setup step)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
          POSTGRES_DB: ains
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass CHANGE_ME_REDIS_PASSWORD
        ports:
          - 6379:6379
        options: >-
          --health-cmd "REDISCLI_AUTH=CHANGE_ME_REDIS_PASSWORD redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: "server"
    - name: Setup Configuration
      run: |
        mv config.toml.example config.toml
        # CI Redis uses CHANGE_ME_REDIS_PASSWORD as configured in the service
        echo "AINS_REDIS_URL=redis://:CHANGE_ME_REDIS_PASSWORD@127.0.0.1:6379" >> $GITHUB_ENV
        # CI PostgreSQL uses password 'CHANGE_ME_POSTGRES_PASSWORD' as configured in the service
        echo "AINS_DATABASE_URL=postgres://postgres:CHANGE_ME_POSTGRES_PASSWORD@127.0.0.1:5432/ains" >> $GITHUB_ENV

    # 静态检查与动态环境解耦：clippy 不依赖 Postgres/Redis，放在复制集群
    # setup 之前执行——services 故障时仍能拿到静态检查结果并快速失败。
    # fmt（全 workspace）由 rust-agent job 执行（本 job 已移除，避免重复）。
    - name: Lint (Clippy)
      run: |
        cargo clippy --package ains-server --all-targets -- -D warnings
        cargo clippy --package ains-server --features ains-salvo --all-targets -- -D warnings
        # 共享 crate（server 的 path 依赖）的单测/lint 曾被 `-p ains-server` 跳过
        # （clippy/test 只作用于指定包自身）：同 job 补齐验证（均为离线单测，
        # 无 DB/Redis 依赖，仅复用 job 内已有的编译缓存与 services 环境）。
        cargo clippy --package ains-runtime --package ains-axum --package ains-salvo --package distributed-ratelimit --package emailserver --package wechat-api --all-targets -- -D warnings

    # ================================================================
    # PostgreSQL Streaming Replication Setup
    # ================================================================
    # This step configures the primary (postgres service) for streaming
    # replication, then creates two standby replicas via pg_basebackup.
    # The replicas have the FULL data (same tables as primary) and are
    # kept in sync via WAL streaming.
    #
    # Prerequisites:
    #   - GH Actions ubuntu-latest has Docker CLI available in steps
    #   - The primary container is accessible via hostname 'postgres'
    #     within the Docker network (GH Actions service DNS)
    - name: Setup PostgreSQL Streaming Replication
      shell: bash
      run: |
        set -euo pipefail

        echo "=== Step 1: Configure primary for streaming replication ==="
        PRIMARY=$(docker ps --filter "ancestor=postgres:16-alpine" --format "{{.Names}}" | head -1)
        echo "Primary container: $PRIMARY"

        docker exec "$PRIMARY" bash -c '
          echo "wal_level = replica"              >> /var/lib/postgresql/data/postgresql.conf
          echo "max_wal_senders = 10"             >> /var/lib/postgresql/data/postgresql.conf
          echo "max_replication_slots = 10"       >> /var/lib/postgresql/data/postgresql.conf
          echo "wal_keep_size = 512"              >> /var/lib/postgresql/data/postgresql.conf
        '
        docker exec "$PRIMARY" psql -U postgres -c \
          "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'CHANGE_ME_POSTGRES_PASSWORD';" 2>/dev/null || true
        docker exec "$PRIMARY" bash -c \
          'echo "host replication replicator all md5" >> /var/lib/postgresql/data/pg_hba.conf'
        docker restart "$PRIMARY"

        echo "=== Step 2: Wait for primary recovery ==="
        for i in $(seq 1 15); do
          if docker exec "$PRIMARY" pg_isready -U postgres 2>/dev/null; then
            echo "Primary recovered after ${i}s"
            break
          fi
          sleep 2
        done

        echo "=== Step 3: Create streaming replicas ==="
        NETWORK=$(docker inspect "$PRIMARY" \
          -f '{{range $net,$v := .NetworkSettings.Networks}}{{$net}}{{"\n"}}{{end}}' | head -1)
        echo "Docker network: $NETWORK"

        for REPLICA in pg-replica1 pg-replica2; do
          REPLICA_PORT="$([ "$REPLICA" = pg-replica1 ] && echo 5433 || echo 5434)"
          echo "Creating $REPLICA on port $REPLICA_PORT..."

          # Volume for replica data (from pg_basebackup)
          docker volume create "${REPLICA}_data"

          # pg_basebackup: copy primary data (hostname 'postgres' resolves within Docker network)
          docker run --rm \
            --network "$NETWORK" \
            -v "${REPLICA}_data":/var/lib/postgresql/data \
            -e PGPASSWORD=CHANGE_ME_POSTGRES_PASSWORD \
            postgres:16-alpine \
            pg_basebackup -h postgres -U replicator -D /var/lib/postgresql/data -Fp -Xs -v

          # Configure standby: touch signal file + set primary_conninfo
          docker run --rm \
            -v "${REPLICA}_data":/var/lib/postgresql/data \
            postgres:16-alpine \
            bash -c "
              touch /var/lib/postgresql/data/standby.signal
              echo \"primary_conninfo = 'host=postgres port=5432 user=replicator password=CHANGE_ME_POSTGRES_PASSWORD'\" \
                >> /var/lib/postgresql/data/postgresql.auto.conf
            "

          # Start replica container (same Docker network → DNS resolves 'postgres')
          docker run -d --name "$REPLICA" \
            --network "$NETWORK" \
            -p "$REPLICA_PORT":5432 \
            -v "${REPLICA}_data":/var/lib/postgresql/data:rw \
            postgres:16-alpine

          echo "$REPLICA started"
        done

        echo "=== Step 4: Wait for streaming replication ==="
        for i in $(seq 1 15); do
          COUNT=$(docker exec "$PRIMARY" psql -U postgres -t -A \
            -c "SELECT count(*) FROM pg_stat_replication WHERE state = 'streaming';" 2>/dev/null || echo "0")
          if [ "$COUNT" -ge 2 ] 2>/dev/null; then
            echo "Both replicas streaming after ${i}s"
            break
          fi
          sleep 2
        done
        echo "=== Replication status ==="
        docker exec "$PRIMARY" psql -U postgres -c \
          "SELECT application_name, state, sync_state FROM pg_stat_replication;"

        echo "=== Step 5: Set env vars for AutoRouter ==="
        echo "AINS_DATABASE_READ_URLS=postgres://postgres:CHANGE_ME_POSTGRES_PASSWORD@127.0.0.1:5433/ains,postgres://postgres:CHANGE_ME_POSTGRES_PASSWORD@127.0.0.1:5434/ains" >> "$GITHUB_ENV"
        echo "=== Streaming replication setup complete ==="
        echo "Replica 1: postgres://postgres:CHANGE_ME_POSTGRES_PASSWORD@127.0.0.1:5433/ains"
        echo "Replica 2: postgres://postgres:CHANGE_ME_POSTGRES_PASSWORD@127.0.0.1:5434/ains"

        # Create root role if it doesn't exist (avoids FATAL role-not-found errors)
        docker exec "$PRIMARY" psql -U postgres -c \
          "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='root') THEN CREATE ROLE root WITH LOGIN; END IF; END \$\$;"

    # replica_circuit_breaker_test 无 feature 门控，已包含在上面的默认
    # `cargo test -p ains-server` 中，不再单独重复执行。
    - name: Run Tests
      run: |
        echo "=== ains-server (default) ==="
        cargo test --package ains-server --verbose
        echo "=== shared crates ==="
        cargo test --package ains-runtime --package ains-axum --package ains-salvo --package distributed-ratelimit --package emailserver --package wechat-api --verbose
        # wechat-api 的 store/login 测试由非默认 feature memory-store 门控
        # （离线内存实现，已实测 47 passed），单独开启补齐覆盖
        echo "=== wechat-api (memory-store) ==="
        cargo test --package wechat-api --features memory-store --verbose
        # Salvo 后端测试由 ains-salvo feature 门控（默认 test 步骤不含）
        echo "=== ains-server (salvo) ==="
        cargo test --package ains-server --features ains-salvo \
          --test salvo_integration_tests \
          --test salvo_logout_all_test \
          --test salvo_plan_test \
          --test salvo_ratelimit_test \
          --verbose

  # ========================================
  # Frontend - Web CI
  # ========================================
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: "web"
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.14.4
    - name: Install dioxus-cli
      run: cargo binstall dioxus-cli --version 0.7.9 -y --force
    # dx 离线构建工具链（NO_DOWNLOADS=1 时全部从 PATH 解析，契约见
    # app/web/tests/dockerfile_wasm_tooling_test.rs 与 Dockerfile.web）：
    # wasm-bindgen-cli 必须与 Cargo.lock 的 wasm-bindgen 版本精确匹配。
    - name: Install wasm-bindgen-cli (match Cargo.lock)
      run: cargo binstall wasm-bindgen-cli --version 0.2.126 -y --force
    - name: Install esbuild
      # 与 Dockerfile.web 相同的 tarball 方式（非 npm 全局安装）：免去
      # runner 对 npm prefix 的写权限依赖，行为与生产镜像完全一致。
      # SHA256 与 npm registry 发布的 dist.integrity 交叉验证一致（2026-08 核验）。
      run: |
        set -euo pipefail
        ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
        curl -L --proto '=https' --tlsv1.2 -sSf \
          "https://registry.npmjs.org/@esbuild/linux-${ARCH}/-/linux-${ARCH}-0.28.1.tgz" \
          -o /tmp/esbuild.tgz
        case "$ARCH" in
          x64)
            echo "9ed00ab5330c94386f3273eda99a1fb0e8f37cfd6cb5270e4ad2fe3527da3546  /tmp/esbuild.tgz" | sha256sum -c - ;;
          arm64)
            echo "2145e9e686c95ee47c1181f83f272f0ff95820e52d7736fdcd9eeb106fd6456a  /tmp/esbuild.tgz" | sha256sum -c - ;;
          *)
            echo "Unsupported architecture: $ARCH" >&2
            exit 1 ;;
        esac
        tar xzf /tmp/esbuild.tgz -C /tmp
        sudo mv /tmp/package/bin/esbuild /usr/local/bin/esbuild
        chmod +x /usr/local/bin/esbuild
        rm -rf /tmp/esbuild.tgz /tmp/package
    - name: Install wasm-opt (binaryen)
      run: sudo apt-get update && sudo apt-get install -y binaryen
    - name: Lint (Clippy, native)
      run: cargo clippy --package web --all-targets -- -D warnings
    - name: Lint (Clippy, wasm32)
      run: cargo clippy --package web --target wasm32-unknown-unknown --all-targets -- -D warnings
    - name: Run Web Tests
      run: cargo test --package web --verbose
    - name: Run UI Tests
      run: cargo test --package ui --verbose
    # 根 workspace 编译验证真实 Web 源码；dockerfile_wasm_tooling_test 会另行
    # 复刻 Docker 专用 workspace，并用 cargo tree --locked --offline --depth 0
    # 验证精简 manifests 与生产锁文件仍可解析。
    - name: Build Web (dx, locked dependencies)
      run: |
        export NO_DOWNLOADS=1
        dx build --locked --release --package web --platform web
    - name: Verify dx build artifacts
      # 空目录同样满足 -d，追加 index.html 存在性校验（与 nginx 入口一致）
      run: |
        test -d target/dx/web/release/web/public
        test -f target/dx/web/release/web/public/index.html
    - name: Detect production Web build changes
      id: prod_web_changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || \
           ! git cat-file -e "${BASE_SHA}^{commit}"; then
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        elif git diff --quiet "${BASE_SHA}" "${GITHUB_SHA}" -- \
          .github/workflows/ains.yml Dockerfile.web \
          Dockerfile.web.dockerignore prod-build/web \
          Cargo.toml Cargo.lock app/web/Cargo.toml app/web/Dioxus.toml \
          app/ui/Cargo.toml app/client-api/Cargo.toml \
          crates/rust-agent/Cargo.toml crates/i18n/Cargo.toml \
          app/web/src app/web/assets app/ui/src app/ui/assets \
          app/client-api/src crates/rust-agent/src crates/i18n/src \
          nginx/default.conf; then
          echo "changed=false" >> "${GITHUB_OUTPUT}"
        else
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Set up Docker Buildx
      if: steps.prod_web_changes.outputs.changed == 'true'
      uses: docker/setup-buildx-action@v4
    - name: Build production Web runtime image
      if: steps.prod_web_changes.outputs.changed == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile.web
        target: runtime
        tags: ains-web-ci:${{ github.sha }}
        load: true
        cache-from: type=gha,scope=ains-web
        # Fork/low-trust PRs may be unable to export a shared cache; cache
        # availability must never decide whether the production build passes.
        cache-to: type=gha,mode=max,scope=ains-web,ignore-error=true
    - name: Smoke test production Web runtime image
      if: steps.prod_web_changes.outputs.changed == 'true'
      env:
        WEB_IMAGE: ains-web-ci:${{ github.sha }}
      run: |
        docker run --rm --add-host ains-server:127.0.0.1 \
          --entrypoint sh "${WEB_IMAGE}" -ec '
            nginx -t
            test -s /usr/share/nginx/html/index.html
            test -s /usr/share/nginx/html/favicon.ico
            set -- /usr/share/nginx/html/assets/*.wasm
            test -s "$1"
            set -- /usr/share/nginx/html/assets/*.js
            test -s "$1"
          '

  # ========================================
  # Client API Library CI
  # ========================================
  client-api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: "client-api"
    # fmt 由 rust-agent job 的 `cargo fmt --check`（全 workspace）覆盖
    - name: Lint (Clippy)
      run: cargo clippy --package client-api --all-targets -- -D warnings
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
    # clippy 已隐含编译检查，无需单独的 wasm32 check 步骤
    - name: Check WASM (Clippy)
      run: cargo clippy --package client-api --target wasm32-unknown-unknown -- -D warnings
    # cargo test 已含编译，不单独 build（避免重复编译同一目标）
    - name: Run Client API Tests
      run: cargo test --package client-api --verbose

  # ========================================
  # Rust Agent CI (wasm32 + native dual target)
  # ========================================
  rust-agent:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: "rust-agent"
    # fmt（全 workspace）唯一执行点：server job 的 fmt 已移除，静态检查与
    # Postgres/Redis services 解耦；本 job 无 services 依赖，稳定执行。
    - name: Format Check
      run: cargo fmt --check
    - name: Lint (Clippy, native)
      run: cargo clippy --package rust-agent --all-targets -- -D warnings
    - name: Build & Test (native)
      run: cargo test --package rust-agent --verbose
    - name: Install Agent Skills reference validator
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate Agent Skills fixture against the reference implementation
      run: |
        python -m pip install git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
        skills-ref validate crates/rust-agent/tests/fixtures/agent-skills/release-check
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Lint (Clippy, wasm32)
      run: cargo clippy --package rust-agent --target wasm32-unknown-unknown --all-targets -- -D warnings
    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack
    # IndexedDB 等浏览器环境测试仅在 CI 执行（AINS_PLAN Phase 0.5）
    - name: Run wasm tests (headless Chrome)
      run: wasm-pack test --headless --chrome crates/rust-agent
    # Modal 的 focus/inert/堆叠行为依赖真实 DOM，NoOpDocument 单测无法覆盖。
    - name: Run UI browser tests (headless Chrome)
      run: wasm-pack test --headless --chrome app/ui

  # ========================================
  # Desktop App CI (Phase 6.2 native agent embedding)
  # ========================================
  desktop:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: "desktop"
    # dioxus-desktop 依赖 GTK/WebKit 系统库（build 期 pkg-config 探测）
    - name: Install system dependencies (dioxus desktop)
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
    - name: Lint (Clippy)
      run: cargo clippy --package desktop --all-targets -- -D warnings
    # desktop 经 #[path] 复用 web 端 views/tools.rs 与 agent/service.rs
    # （含 #[test]）：cargo test 实际执行这些复用测试（本地 74 passed），
    # 验证 crate::test_shared 在 desktop 的解析与全局信号串行锁行为。
    # Test 与 Build 合并为单步骤：bin-only crate 的 `cargo test` 仅以
    # test-harness 形态编译，保留 `cargo build` 验证正式二进制构建。
    - name: Test & Build
      run: |
        cargo test --package desktop --verbose
        cargo build --package desktop --verbose

  # ========================================
  # Security - dependency vulnerability audit
  # ========================================
  security-audit:
    runs-on: ubuntu-latest
    # audit-check 需要通过 Checks API 创建 Check Run 展示审计结果
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4
    # 扫描根 Cargo.lock 已知 RUSTSEC 漏洞；Web 契约测试强制生产锁文件的
    # package/version/source/checksum 全部是根锁文件的子集，因此同时覆盖
    # prod-build/web/Cargo.lock。豁免项及论证见 .cargo/audit.toml。
    - name: Cargo audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
