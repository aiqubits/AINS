[package]
name = "rust-agent"
description = "AINS Agent Runtime Core: WASM/Native dual-target embedded agent runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
# 索引加载跳过损坏行等静默降级路径的可观测性（facade，双 target）
tracing.workspace = true
# ContextStore 图片附件 → Image content block 的 base64 编码（纯 Rust，双 target）
base64 = "0.22"
# 记忆存储信封（TTL + JSON 载荷）的二进制序列化（跨平台，见 AINS_PLAN 附录 A）
bincode = "1"
# 记忆去重签名 / memdir 条目 ID（sha256，跨平台）
sha2 = "0.10"
# DocumentStore Markdown 按标题层级切分（跨平台）
pulldown-cmark = "0.10"
# Network Tool URL 解析与 SSRF 防护（tools/network.rs，双 target）
url = "2"
# Phase 5.2 GatewayModelClient：底层复用 client-api AI 传输层（双 target）
client-api = { workspace = true }
# Phase 5.2 流式重试状态机的 stream! 生成器（纯 Rust，双 target）
async-stream = "0.3"

# Phase 7.5 本地数据静态加密（memory/kv_crypto.rs，EncryptedKvStore 装饰器，双 target）：
# ChaCha20-Poly1305 AEAD（纯 Rust，wasm 兼容）。仅用 alloc 侧 encrypt/decrypt，
# nonce/密钥随机数由 getrandom 直接生成（不依赖 aead 的 OsRng）。zeroize 是
# chacha20poly1305 0.10 的硬依赖（库内无条件启用，无 feature 开关）：
# `EncryptionKey` Drop 清零依赖的密钥副本 zeroize 化由库保证。
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# 口令 → 密钥派生（Argon2id，密码哈希 KDF，纯 Rust双 target）
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# 密钥/中间态内存清零（Drop 时 zeroize，防密钥残留）
zeroize = "1"
# 加密 nonce / 随机密钥的 CSPRNG（双 target；wasm 侧启用 js 后端，见下方 target 表）
getrandom = "0.2"
# 正则：供 tools/filesystem.rs grep 内容检索（Native）与 personalization 偏好抽取
# （双 target，纯 Rust wasm 兼容）。
regex = "1"
# Agent Skills 名称与 skills-ref 使用 NFKC 规范化后比较；纯 Rust，WASM 兼容。
unicode-normalization = "0.1"

# ── 平台特定依赖：由 cfg(target_arch = "wasm32") 互斥选择（见 AINS_PLAN 附录 A）──

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 供 runtime_native.rs（TokioRuntimeAdapter）使用
tokio.workspace = true
# 供 memory/kv_native.rs（RedbKvStore）使用
redb = "2"
# 供 memory/vector_native.rs 使用：HNSW 近似检索仅 Native（见 AINS_PLAN 4.2）
hnsw_rs = "0.3"
# 供 memory/parser.rs 使用：PDF 文本提取仅 Native（见 AINS_PLAN 4.3）
pdf-extract = "0.12"
# 供 tools/network.rs / tools/mcp.rs 使用：Native HTTP 客户端（重定向手动逐跳复检）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# 供 tools/filesystem.rs glob/grep 使用：尊重 .gitignore 的目录遍历（对齐 rg --files 语义）
ignore = "0.4"
# 供 policy/sandbox_linux.rs 使用：探测 bubblewrap（bwrap）可执行（Phase 7.1）
which = { workspace = true }
# Native 文件工具通过目录描述符逐段打开路径，避免检查后再按路径访问的
# symlink TOCTOU 越界（Unix 的 openat + O_NOFOLLOW）。
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 供 policy/sandbox_windows.rs 使用：Job Object 进程隔离 FFI（Phase 7.1；
# 无 C 构建，仅链接导入库）。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 供 memory/kv_crypto.rs 加密 nonce/密钥生成：启用 getrandom js 后端
# （浏览器 crypto.getRandomValues），RustCrypto RNG 在 wasm 下的标准接入方式。
getrandom = { version = "0.2", features = ["js"] }
# 供 tools/mcp.rs 使用：浏览器 streamable-http 后端。web_fetch 在 Web 端
# 因无法可靠校验 DNS/重定向目标而 fail-closed。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
# 供 runtime_web.rs（WasmRuntimeAdapter）与 memory/kv_web.rs（IndexedDbKvStore）使用
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "Event",
    "DomException",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbRequest",
    "IdbKeyRange",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Phase 2 记忆系统集成测试：redb 临时数据库目录
tempfile = "3"
# Phase 5 模型传输层集成测试：Mock AI Gateway
wiremock = "0.6"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
