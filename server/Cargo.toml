[package]
name = "ains-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories = ["asynchronous", "network-programming", "web-programming"]
keywords = ["web", "server", "backend", "fullstack", "scaffold"]
description = "The best way to develop your web service with one click."
license.workspace = true
readme = "../README.md"
repository.workspace = true
homepage.workspace = true

[dependencies]
# Web framework abstraction (不直接依赖 axum/tower/tower-http/http/http-body-util)
ains-runtime = { workspace = true }
ains-axum = { workspace = true, optional = true }  # 默认后端
ains-salvo = { workspace = true, optional = true }  # salvo 可选后端
tokio = { version = "1", features = ["full"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

# Database
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
# 与 sea-orm 共享同一 sqlx 实例：downcast sqlx::Error::Database 以按 SQLSTATE 码
# 分类 PostgreSQL 服务端错误（免疫 LC_MESSAGES 本地化，见 db_router.rs 的 pg_sqlstate）。
# 注意：必须与 sea-orm 解析到同一 sqlx 主版本（当前均为 0.8.x）；若 sea-orm 升级
# sqlx 主版本而此处未同步，db_router.rs 的 downcast 会因类型不匹配而编译失败（防护）。
sqlx = { version = "0.8", default-features = false }
async-trait = "0.1"
parking_lot = "0.12"

# Redis for distributed locking, caching, and rate limiting
redis = { version = "1.2.3", features = ["tokio-comp", "connection-manager"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"
distributed-ratelimit.workspace = true

# Configuration
config = "0.15"
clap = { version = "4", features = ["derive"] }

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
cookie = "0.18"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

# Email
emailserver.workspace = true

# WeChat Official Account captcha-login
wechat-api.workspace = true

# Validation
validator = { version = "0.19", features = ["derive"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
anyhow.workspace = true
thiserror.workspace = true
http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
# test-util 启用 tokio 虚拟时钟（start_paused），用于确定性、无实际等待的超时测试
tokio = { version = "1", features = ["full", "test-util"] }
# tower 仅用于内联测试和集成测试中的 ServiceExt::oneshot()
tower = { version = "0.5", features = ["util"] }
# reqwest 用于 Salvo 模式的集成测试（通过 HTTP 客户端发送请求）
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
# salvo 用于 Salvo 模式的集成测试（Server、TcpListener 等类型）
salvo = { workspace = true }

[features]
default = ["ains-axum"]
ains-axum = ["dep:ains-axum"]
ains-salvo = ["dep:ains-salvo"]
