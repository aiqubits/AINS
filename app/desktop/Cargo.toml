[package]
name = "desktop"
version = "0.1.0"
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-icons = { workspace = true }
ui = { workspace = true }
i18n = { workspace = true }
# Agent Runtime 嵌入（Phase 6.2，Native）
rust-agent = { workspace = true }
client-api = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { workspace = true }
# Reuse Dioxus Desktop's portal backend; avoid enabling rfd's default Wayland
# stack, which is unnecessary here and keeps the packaged dependency surface
# aligned with the host shell.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
