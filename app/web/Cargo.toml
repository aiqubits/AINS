[package]
name = "web"
version = "0.1.0"
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
dioxus-icons = { workspace = true }
client-api = { workspace = true }
# Agent Runtime 嵌入（Phase 6.1）
rust-agent = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# Skills 详情 frontmatter 展示（与 rust-agent 公开 API 同版本）
serde_yaml = "0.9"
chrono = { workspace = true }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
# i18n crate — 仅使用 Language 枚举（无需 dioxus feature；I18nContext 通过 ui 的 re-export 间接获取）
i18n = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Document", "HtmlDocument", "Element", "console"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# agent 桥接层单测（permission_bridge 异步契约）
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Browser-level regression coverage for APIs unavailable to native unit tests
# (notably the Web Locks extraction gate and computed layout styles).
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["CssStyleDeclaration"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dep:rfd"]
