services:
  # ========================================
  # Backend - AINS Server
  # ========================================
  ains-server:
    image: ains-server
    build:
      context: .
      dockerfile: Dockerfile.server
    pull_policy: build
    container_name: ains-server
    # Only expose backend port on localhost — all external traffic
    # MUST go through the nginx reverse proxy (ains-web) which provides
    # rate limiting, security headers, and request body size limits.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - AINS_ENV=${AINS_ENV:-development}
      # ⚠️  For production, always set AINS_POSTGRES_PASSWORD in .env; the fallback below
      #     is for local development only and MUST be changed before deploying.
      - AINS_DATABASE_URL=postgres://postgres:${AINS_POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@postgres:5432/ains
      # Read replica database URLs (comma-separated, empty = disabled).
      # When configured, SELECT queries are automatically routed to read replicas.
      # Example: postgres://postgres:password@pg-replica1:5432/ains,postgres://postgres:password@pg-replica2:5432/ains
      - AINS_DATABASE_READ_URLS=${AINS_DATABASE_READ_URLS:-}
      # Redis URL with password authentication.
      # ⚠️  IMPORTANT: If AINS_REDIS_PASSWORD contains URL-special characters
      #     (@  :  /  #  ?), they MUST be percent-encoded in the URL
      #     (e.g., p%40ss for p@ss, p%2Fss for p/ss).
      #     To avoid this issue, generate passwords with:
      #       openssl rand -hex 32
      #     (hex-only passwords are URL-safe.)
      - AINS_REDIS_URL=redis://:${AINS_REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@redis:6379
      - AINS_JWT_SECRET=${AINS_JWT_SECRET:?Set AINS_JWT_SECRET in .env file}
      # System admin account (seeded on first boot). Passed through so values set
      # in .env actually reach the container; required in non-development mode.
      - AINS_SYSTEM_ADMIN_EMAIL=${AINS_SYSTEM_ADMIN_EMAIL:-admin@ains.local}
      - AINS_SYSTEM_ADMIN_PASSWORD=${AINS_SYSTEM_ADMIN_PASSWORD:-change-me-admin-password}
      # WeChat Official Account (captcha login). These MUST be listed here so
      # values in .env actually reach the container — docker-compose only uses
      # .env for ${VAR} substitution, NOT automatic container injection. When
      # the required credentials are empty the feature is disabled gracefully.
      - AINS_WECHAT__ENABLED=${AINS_WECHAT__ENABLED:-false}
      - AINS_WECHAT__APP_ID=${AINS_WECHAT__APP_ID:-}
      - AINS_WECHAT__APP_SECRET=${AINS_WECHAT__APP_SECRET:-}
      - AINS_WECHAT__TOKEN=${AINS_WECHAT__TOKEN:-}
      - AINS_WECHAT__ACCOUNT_ID=${AINS_WECHAT__ACCOUNT_ID:-}
      - AINS_WECHAT__ORIGINAL_ID=${AINS_WECHAT__ORIGINAL_ID:-}
      - AINS_WECHAT__ENCODING_AES_KEY=${AINS_WECHAT__ENCODING_AES_KEY:-}
      - AINS_WECHAT__MESSAGE_MODE=${AINS_WECHAT__MESSAGE_MODE:-plain}
      - AINS_WECHAT__CAPTCHA_TTL_SECS=${AINS_WECHAT__CAPTCHA_TTL_SECS:-300}
      - AINS_WECHAT__RESEND_COOLDOWN_SECS=${AINS_WECHAT__RESEND_COOLDOWN_SECS:-60}
      - AINS_WECHAT__MAX_FAILED_ATTEMPTS=${AINS_WECHAT__MAX_FAILED_ATTEMPTS:-5}
      - AINS_WECHAT__CAPTCHA_LEN=${AINS_WECHAT__CAPTCHA_LEN:-5}
      - AINS_WECHAT__TRIGGER_KEYWORDS=${AINS_WECHAT__TRIGGER_KEYWORDS:-验证码,登录码,login}
      - AINS_WECHAT__SUBSCRIBE_REPLY=${AINS_WECHAT__SUBSCRIBE_REPLY:-感谢关注 AINS！发送「验证码」即可获取用于网页端登录的验证码。}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ains-net
      # 外部 ollama（同宿主 keycompute 项目的 compose 网络）：ain-server 经
      # 服务名 keycompute-ollama:11434 访问 OpenAI 兼容端点。不同自定义 bridge
      # 网络默认隔离且 ollama 端口未发布宿主机，故必须加入该外部网络；容器
      # 重建后配置仍生效（external 网络需精确 name 声明，见底部 networks）。
      - keycompute-public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Frontend - AINS Web (Dioxus WASM from app/web)
  # ========================================
  ains-web:
    image: ains-web
    build:
      context: .
      dockerfile: Dockerfile.web
    pull_policy: build
    container_name: ains-web
    ports:
      # Host-side web port is operator-tunable via .env (AINS_WEB_PORT).
      - "${AINS_WEB_PORT:-80}:80"
    volumes:
      # Mount nginx config for runtime override without rebuilding
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ains-server:
        condition: service_healthy
    networks:
      - ains-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    pull_policy: missing
    container_name: ains-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${AINS_POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
      - POSTGRES_DB=ains
    # Only expose PostgreSQL on localhost — all inter-container traffic
    # goes through the internal Docker network (ains-net).
    # Remove the bind address prefix if you need to connect from a remote host
    # (not recommended for production).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ains-postgres-data:/var/lib/postgresql/data
    networks:
      - ains-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis Cache
  # ========================================
  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: ains-redis
    command: redis-server --requirepass ${AINS_REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${AINS_REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ains-redis-data:/data
    networks:
      - ains-net
    restart: unless-stopped
    healthcheck:
      # Use REDISCLI_AUTH env var instead of -a flag to avoid password
      # appearing in process list (ps aux).
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ains-postgres-data:
    driver: local
  ains-redis-data:
    driver: local

networks:
  ains-net:
    driver: bridge
  # 同宿主其它 compose 项目（keycompute）的 ollama 网络：external 网络必须
  # external: true + 精确 name（docker compose 默认不会自动发现外部网络）。
  keycompute-public:
    external: true
    name: keycompute-replicas_keycompute-public
